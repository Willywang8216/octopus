services:
  octopus:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_VERSION: "${NEXT_PUBLIC_APP_VERSION:-local}"
    image: octopus-local:dev
    container_name: octopus
    ports:
      - "8080:8080"
    volumes:
      - "${OCTOPUS_DATA_DIR:-./data}:/app/data"
    restart: unless-stopped
    networks:
      1panel-network:
        ipv4_address: 172.18.0.39


networks:
  1panel-network:
    external: true
